## FROM DATA

# metadata for the ontology:
# (base_uri = unique web address for the ontology)
meta:
  title: "Food, Nutrition, and Health Ontology"
  version: "2.0"
  created: "2025-10-26"
  base_uri: "http://example.org/food#"
  description: >
    A minimal ontology for representing food ingredients, nutrients, preparation techniques,
    dietary guidelines, and associated health outcomes, based on the report
    'Sustainable Health from Food – National Nutrition Recommendations 2024'.

# prefixes: abbreviations for long web addresses (URIs) to identify things in the ontology
prefixes:
  ex:   "http://example.org/food#"
  xsd:  "http://www.w3.org/2001/XMLSchema#"
  prov: "http://www.w3.org/ns/prov#"

conventions:
  uri_pattern: "ex:{class}.{slug}"
  slug_rules: "lowercase, ascii, words separated by '_'"
  id_examples:
    nutrient: "ex:nutrient.vitamin_c"
    foodGroup: "ex:foodgroup.red_meat"
    foodItem: "ex:fooditem.salmons"
    recipe: "ex:recipe.oat_porridge"

classes:

  ingredient:
    description: A raw or minimally processed edible material.
    attributes:
      name:        {type: xsd:string, cardinality: 1}
      description: {type: xsd:string, cardinality: 0..1}
      origin:      {type: xsd:string, cardinality: 0..1}

  nutrient:
    description: Chemical or bioactive substance with a physiological function.
    attributes:
      name:             {type: xsd:string, cardinality: 1}
      nutrientType:     {type: xsd:string, cardinality: 0..1}   # vitamin|mineral|macro|fatty_acid|other
      function:         {type: xsd:string, cardinality: 0..1}
      deficiencySymptoms: {type: xsd:string, cardinality: 0..1}
      foodSources:      {type: xsd:string, cardinality: 0..*}

  technique:
    description: Preparation, cooking, or processing method (e.g., boiling, baking).
    attributes:
      name:        {type: xsd:string, cardinality: 1}
      description: {type: xsd:string, cardinality: 0..1}

  recipe:
    description: A dish/composite food that uses ingredients and techniques.
    attributes:
      name:        {type: xsd:string, cardinality: 1}
      description: {type: xsd:string, cardinality: 0..1}

  dietaryGuideline:
    description: A guideline statement from the PDF targeting foods or nutrients.
    attributes:
      id:           {type: xsd:string, cardinality: 1}  # stable identifier for this guideline row/statement
      statement:    {type: xsd:string, cardinality: 1}  # full text of the recommendation
      scope:        {type: xsd:string, cardinality: 0..1}  # e.g., general population, children, etc.
      justification: {type: xsd:string, cardinality: 0..1}

  environmentImpact:
    description: Quantified environmental effect for a food/item/process/guideline.
    attributes:
      name:         {type: xsd:string,  cardinality: 1}
      impactCategory: {type: xsd:string, cardinality: 1}  # climate|eutrophication|water_use|land_use|biodiversity
      value:        {type: xsd:float,   cardinality: 1}
      unit:         {type: xsd:string,  cardinality: 1}
      method:       {type: xsd:string,  cardinality: 0..1}
      geography:    {type: xsd:string,  cardinality: 0..1}
      year:         {type: xsd:integer, cardinality: 0..1}
      source:       {type: xsd:string,  cardinality: 0..1}

  foodGroup:
    description: Controlled vocabulary categories used in the PDF (e.g., Red meat, Whole grains, Fish).
    attributes:
      name:       {type: xsd:string, cardinality: 1}
      definition: {type: xsd:string, cardinality: 0..1}

  foodItem:
    description: A concrete edible thing (raw or processed) that may belong to a food group.
    attributes:
      name:        {type: xsd:string, cardinality: 1}
      description: {type: xsd:string, cardinality: 0..1}

  quantity:
    description: A normalized numeric quantity with unit and optional time basis.
    attributes:
      value: {type: xsd:float,  cardinality: 1}
      unit:  {type: xsd:string, cardinality: 1}   # g|mg|µg|kcal|E%|portion
      per:   {type: xsd:string, cardinality: 0..1} # day|week|meal|portion
      low:   {type: xsd:float,  cardinality: 0..1} # for ranges
      high:  {type: xsd:float,  cardinality: 0..1}

  threshold:
    description: A comparator with a quantity, representing limits/targets.
    attributes:
      operator:   {type: xsd:string, cardinality: 1} # <=|>=|range|<|>
      quantityId: {type: xsd:string, cardinality: 0..1} # URI of a quantity node if referenced

  populationGroup:
    description: A group defined by age, sex, or life stage.
    attributes:
      label:     {type: xsd:string, cardinality: 1}  # e.g., "Women 18–74"
      minAge:    {type: xsd:float,  cardinality: 0..1}
      maxAge:    {type: xsd:float,  cardinality: 0..1}
      sex:       {type: xsd:string, cardinality: 0..1}  # male|female|all
      lifeStage: {type: xsd:string, cardinality: 0..1}  # pregnancy|lactation|older_adults|children

  dietaryReferenceValue:
    description: A single DRV cell (e.g., RDA/AI/UL) for a nutrient and a population.
    attributes:
      type:  {type: xsd:string, cardinality: 1}  # RDA|AI|UL|AR|EAR
      value: {type: xsd:float,  cardinality: 1}
      unit:  {type: xsd:string, cardinality: 1}
      note:  {type: xsd:string, cardinality: 0..1}

  document:
    description: A source document (the PDF).
    attributes:
      id:    {type: xsd:string, cardinality: 1}   # e.g., "SUSTAINABLE_HEALTH_FROM_FOOD"
      title: {type: xsd:string, cardinality: 1}

  mentionSpan:
    description: A specific span in parsed text (NER hit) anchored to page/section.
    attributes:
      docId:     {type: xsd:string,  cardinality: 1}
      page:      {type: xsd:integer, cardinality: 1}
      startChar: {type: xsd:integer, cardinality: 1}
      endChar:   {type: xsd:integer, cardinality: 1}
      text:      {type: xsd:string,  cardinality: 0..1}
      section:   {type: xsd:string,  cardinality: 0..1}  # store heading path text directly

  canonicalEntity:
    description: The “real” node that spans/aliases resolve to (for coref & linking).
    attributes:
      id:        {type: xsd:string, cardinality: 1}  # e.g., ex:nutrient.vitamin_c
      label:     {type: xsd:string, cardinality: 1}
      classType: {type: xsd:string, cardinality: 1}  # nutrient|ingredient|foodGroup|foodItem|technique|recipe

  alias:
    description: Alternative surface form for a canonical entity.
    attributes:
      text: {type: xsd:string, cardinality: 1}

  evidence:
    description: Citation details grounding a fact or guideline to the PDF.
    attributes:
      quote:    {type: xsd:string,  cardinality: 0..1}
      page:     {type: xsd:integer, cardinality: 1}
      tableId:  {type: xsd:string,  cardinality: 0..1}
      figureId: {type: xsd:string,  cardinality: 0..1}
      section:  {type: xsd:string,  cardinality: 0..1}

relations:

  hasIngredient:
    domain: recipe
    range: ingredient
    description: Recipe contains an ingredient.
    cardinality: "0..* -> 0..*"

  hasQuantity:
    domain: recipe
    range: quantity
    description: Quantity context for a given ingredient within the recipe (if modeling recipes).
    cardinality: "0..* -> 0..*"

  usesTechnique:
    domain: recipe
    range: technique
    description: Recipe uses a preparation/cooking technique.
    cardinality: "0..* -> 0..*"

  hasNutrient:
    domain: ingredient
    range: nutrient
    description: Ingredient is a source of a nutrient.
    cardinality: "0..* -> 0..*"

  belongsToGroup:
    domain: ingredient
    range: foodGroup
    description: Ingredient belongs to a food group.
    cardinality: "0..* -> 0..*"

  belongsToGroup_item:
    domain: foodItem
    range: foodGroup
    description: Food item belongs to a food group.
    cardinality: "0..* -> 0..*"

  targetsGroup:
    domain: dietaryGuideline
    range: foodGroup
    description: Guideline targets a food group.
    cardinality: "0..* -> 0..*"

  targetsNutrient:
    domain: dietaryGuideline
    range: nutrient
    description: Guideline targets a nutrient.
    cardinality: "0..* -> 0..*"

  recommendsAmount:
    domain: dietaryGuideline
    range: quantity
    description: Recommended amount/frequency per time basis.
    cardinality: "0..* -> 0..*"

  hasThreshold:
    domain: foodItem
    range: threshold
    description: Upper/lower limit associated with a food item (e.g., “≤ 500 g/week”).
    cardinality: "0..* -> 0..*"

  hasThreshold_fg:
    domain: foodGroup
    range: threshold
    description: Upper/lower limit associated with a food group.
    cardinality: "0..* -> 0..*"

  hasDRV:
    domain: nutrient
    range: dietaryReferenceValue
    description: Nutrient has a dietary reference value entry.
    cardinality: "0..* -> 0..*"

  forPopulation:
    domain: dietaryReferenceValue
    range: populationGroup
    description: The DRV pertains to a particular population group.
    cardinality: "1 -> 1"

  hasImpact:
    domain: foodItem
    range: environmentImpact
    description: Environmental impact metrics associated with a food item.
    cardinality: "0..* -> 0..*"

  hasImpact_fg:
    domain: foodGroup
    range: environmentImpact
    description: Environmental impact metrics associated with a food group.
    cardinality: "0..* -> 0..*"

  hasAlias:
    domain: canonicalEntity
    range: alias
    description: Alternative surface form for the canonical entity.
    cardinality: "0..* -> 0..*"

  hasMention:
    domain: canonicalEntity
    range: mentionSpan
    description: A specific text span that refers to the canonical entity.
    cardinality: "0..* -> 0..*"

  refersTo:
    domain: mentionSpan
    range: canonicalEntity
    description: Span resolves to a canonical entity (inverse of hasMention).
    cardinality: "0..* -> 1"

  supportedBy:
    domain: dietaryReferenceValue
    range: evidence
    description: Evidence node grounding the DRV to page/table/figure.
    cardinality: "0..* -> 0..*"

  derivedFrom:
    domain: dietaryGuideline
    range: evidence
    description: Evidence node grounding the guideline statement.
    cardinality: "0..* -> 0..*"
